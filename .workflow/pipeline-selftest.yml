version: '1.0'
name: pipeline-selftest
displayName: pipeline-selftest
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - master
        - dev
  pr:
    branches:
      precise:
        - master
        - dev
stages:
  - name: stage-86984a88
    displayName: selftest
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: execute@docker
        name: execute_by_docker
        displayName: 基于镜像的脚本执行
        certificate: ''
        image: ubuntu:22.04
        command:
          - '# 安装编译工具'
          - apt-get update && apt-get install -y build-essential gcc make pthread
          - '# 编译测试'
          - cd test/selftest && make clean && make
          - '# 执行测试并保存结果'
          - cd test/selftest && ./build/BabyOS 2>&1 | tee test_output.log
          - '# 检查测试结果'
          - 'if grep -q "Result: ALL PASSED" test/selftest/test_output.log; then echo "=== TEST PASSED ===" && exit 0; else echo "=== TEST FAILED ===" && cat test/selftest/test_output.log && exit 1; fi'
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./test/selftest/build/BabyOS
              - ./test/selftest/test_output.log
        notify: []
        strategy:
          retry: '0'
